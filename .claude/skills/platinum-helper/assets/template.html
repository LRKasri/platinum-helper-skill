<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111315; --bg2:#16191c; --card:#1a1d21; --card2:#1f2327; --line:#2b3035; --line2:#353b41;
  --tx:#e9e6e1; --tx2:#b9b5ae; --mut:#7f858c; --mut2:#5c6268;
  --red:#d2483b; --red2:#9e3a30; --redbg:#2a1715; --redline:#7a3029;
  --green:#79ad91; --greenbg:#1d2a24;
  --gold:#c9a25a; --purple:#9b90d6; --teal:#5fb0a2; --blue:#6f9fd8; --orange:#d88a4a; --pink:#d27aa0;
  --plat:#a9c3d9; --goldt:#d9b55b; --silver:#b8bfc6; --bronze:#c08454;
  --brush:"Ma Shan Zheng","STXingkai","STKaiti","KaiTi","Kaiti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.6}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
/* ---------- top ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.searchrow{display:flex;gap:8px;align-items:center;padding:12px 0 10px}
.search{flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:4px;background:var(--bg2)}
.search svg{flex:none;color:var(--mut)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px}
.search input::placeholder{color:var(--mut)}
.search .clr{color:var(--mut);font-size:18px;line-height:1;padding:4px;display:none}
.search.has .clr{display:block}
.iconbtn{flex:none;height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:var(--bg2);color:var(--tx2);font-size:14px;font-weight:600;letter-spacing:.5px}
.iconbtn.lang{color:var(--tx)}
.tabwrap{position:relative;margin:0 -16px}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:0 16px;scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tabarr{position:absolute;top:0;bottom:3px;width:34px;z-index:2;display:none;align-items:center;justify-content:center;font-size:24px;line-height:1;color:var(--tx)}
.tabarr.l{left:0;background:linear-gradient(90deg,var(--bg) 55%,transparent)}
.tabarr.r{right:0;background:linear-gradient(270deg,var(--bg) 55%,transparent)}
.tabarr.show{display:flex}
@media (pointer:fine){
  .tabs,.tfilters{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  .tabs::-webkit-scrollbar,.tfilters::-webkit-scrollbar{display:block;height:4px}
  .tabs::-webkit-scrollbar-thumb,.tfilters::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
}
.rtab{flex:none;padding:6px 16px 10px 0;margin-right:14px;text-align:left;position:relative;opacity:.55}
.rtab .no{display:block;font-size:12px;letter-spacing:4px;color:var(--mut)}
.rtab .nm{display:block;font-family:var(--brush);font-size:24px;line-height:1.25;white-space:nowrap;color:var(--tx2)}
.rtab.en .nm{font-family:var(--sans);font-size:16px;font-weight:600;padding-top:4px}
.rtab.on{opacity:1}
.rtab.on .no{color:var(--green)}
.rtab.on .nm{color:var(--tx)}
.rtab.on::after{content:"";position:absolute;left:0;right:16px;bottom:0;height:3px;background:var(--red)}
.rtab .mini{position:absolute;left:0;right:16px;bottom:0;height:3px;background:var(--line2)}
.rtab .mini i{display:block;height:100%;background:var(--green)}
/* ---------- region header ---------- */
.rhead{display:flex;align-items:center;gap:16px;padding:22px 0 8px}
.rhead .l{flex:1;min-width:0}
.rno{font-size:14px;letter-spacing:6px;color:var(--green)}
.rname{font-family:var(--brush);font-size:46px;line-height:1.2;margin:4px 0 6px;word-break:keep-all}
.rname.en{font-family:var(--sans);font-size:30px;font-weight:700}
.rcount{color:var(--tx2);font-size:15px}
.ring{flex:none;width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.ring .v small{font-size:12px;font-weight:500;margin-left:1px;margin-top:6px}
.rdesc{border-left:3px solid var(--red);padding:2px 0 2px 14px;margin:14px 0 18px;color:var(--tx2);font-size:15.5px}
.stats{display:flex;flex-wrap:wrap;border-top:1px solid var(--line2);border-left:1px solid var(--line2);margin-bottom:18px}
.stat{flex:1 0 20%;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:12px 2px 10px;text-align:center;min-width:0}
.stat b{display:block;font-size:22px;line-height:1.2;font-weight:700}
.stat span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.full b{color:var(--green)}
.stat.sel{background:var(--card2)}
.stat.sel span{color:var(--tx)}
/* ---------- boxes ---------- */
.box{border:1px solid var(--line2);border-radius:4px;background:var(--card);margin-bottom:12px}
.box>.bh{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;text-align:left}
.box>.bh .t{flex:1;font-weight:700;font-size:16.5px}
.box>.bh .n{color:var(--mut);font-size:14px}
.box>.bb{padding:0 16px 14px}
.box.warn{border-color:var(--redline);background:var(--redbg)}
.box.warn>.bh .t{color:var(--red)}
.box.warn ul{margin:0;padding:0;list-style:none}
.box.warn li{position:relative;padding-left:22px;margin:6px 0;font-size:15.5px}
.box.warn li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;background:var(--red);transform:rotate(45deg)}
.chev{flex:none;transition:transform .2s;color:var(--mut)}
.closed .chev{transform:rotate(180deg)}
.closed>.bb,.closed>.sb{display:none}
.bb p{margin:0 0 8px;color:var(--tx2);font-size:14.5px}
.bfacts{margin-top:8px;padding:8px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:3px;font-size:14px}
.bb p:last-child{margin-bottom:0}
/* ---------- filters ---------- */
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 18px}
.fbtn{height:40px;border:1px solid var(--line2);border-radius:4px;background:var(--bg2);color:var(--tx2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.fbtn.on{background:var(--red);border-color:var(--red);color:#fff}
.typebar{display:flex;align-items:center;gap:8px;margin:-8px 0 14px;font-size:14px;color:var(--tx2)}
.typebar button{color:var(--red);font-size:14px}
/* ---------- steps ---------- */
.steps{position:relative}
.step{display:flex;gap:12px;margin-bottom:14px;position:relative}
.step .num{flex:none;width:30px;display:flex;flex-direction:column;align-items:center}
.step .num b{width:28px;height:28px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--bg);margin-top:16px;position:relative;z-index:1}
.step .num::after{content:"";position:absolute;top:0;bottom:-14px;left:14px;width:1px;background:var(--line2)}
.step:last-child .num::after{bottom:0}
.step.complete .num b{background:var(--green);border-color:var(--green);color:#10201a}
.scard{flex:1;min-width:0;border:1px solid var(--line2);border-radius:4px;background:var(--card)}
.scard>.sh{display:block;width:100%;text-align:left;padding:14px 16px 0}
.sh .row{display:flex;align-items:flex-start;gap:10px}
.sh .t{flex:1;min-width:0;font-size:18px;font-weight:700;line-height:1.45}
.sh .t small{display:block;font-size:13px;font-weight:400;color:var(--mut);margin-top:2px}
.sh .n{flex:none;color:var(--mut);font-size:15px;padding-top:2px;font-variant-numeric:tabular-nums}
.step.complete .sh .n{color:var(--green)}
.sh .bar{height:3px;background:var(--line2);margin:12px 0 0}
.sh .bar i{display:block;height:100%;background:var(--red);transition:width .25s}
.step.complete .sh .bar i{background:var(--green)}
.sb{padding:0 16px 6px}
.reach{font-size:14px;color:var(--mut);padding:12px 0 4px;border-bottom:1px solid var(--line)}
.sect{font-size:13px;letter-spacing:1px;color:var(--gold);padding:14px 0 2px;border-bottom:1px solid var(--line)}
.srclink{display:block;font-size:13px;color:var(--mut);padding:12px 0 8px;text-decoration:none}
/* ---------- items ---------- */
.it{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.it:last-of-type{border-bottom:0}
.cb{flex:none;width:30px;height:30px;border:1.5px solid var(--mut2);border-radius:3px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cb svg{opacity:0}
.it.done .cb{background:var(--red2);border-color:var(--red2)}
.it.done .cb svg{opacity:1}
.ii{flex:none;width:30px;display:flex;justify-content:center;padding-top:3px;color:var(--mut)}
.im{flex:1;min-width:0}
.ih{display:flex;align-items:flex-start;gap:8px}
.ttl{font-size:17px;font-weight:700;line-height:1.45;word-break:break-word}
.it.done .ttl{text-decoration:line-through;text-decoration-color:var(--mut)}
.it.done .ttl,.it.done .ibd,.it.done .badge,.it.done .chip{opacity:.45}
.badge{flex:none;min-width:24px;height:24px;padding:0 3px;border:1px solid currentColor;border-radius:2px;font-size:13px;line-height:22px;text-align:center;margin-top:2px}
.ibd{color:var(--tx2);font-size:15px;margin-top:4px;word-break:break-word}
.ibd ul{margin:6px 0;padding-left:20px}
.ibd li{margin:2px 0}
.ibd .red,.ttl .red{color:#ff7a6b}
.ibd .green{color:var(--green)}
.ibd b{color:var(--tx)}
t.bronze,t.silver,t.gold,t.platinum{display:inline-block;width:.85em;height:.85em;border-radius:50%;vertical-align:-1px;margin:0 2px}
t.bronze{background:var(--bronze)} t.silver{background:var(--silver)} t.gold{background:var(--goldt)} t.platinum{background:var(--plat)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line2);border-radius:3px;font-size:13.5px;color:var(--tx2);background:none}
.chip.tro{border-color:#6b5a33;color:var(--gold)}
.chip.tro.pre{border-style:dashed;color:#c9b27a}
.chip.nr{border-color:var(--red);color:var(--red)}
.prenote{font-size:13px;color:#b9a46e;margin-top:6px}
.prelh{font-size:13px;color:var(--tx3);margin:14px 0 2px}
.chip.miss{border-color:#5a4f8a;color:var(--purple)}
.chip.opt{border-style:dashed;color:var(--mut)}
.it.opt .cb,.crow.opt .cb{border-style:dashed}
.modesw{display:inline-flex;margin-top:10px;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.modesw button{padding:5px 14px;font-size:13.5px;color:var(--tx2)}
.modesw button.on{background:var(--red);color:#fff}
.optag{font-size:12px;color:var(--mut);border:1px dashed var(--line2);border-radius:2px;padding:0 5px;margin-left:6px}
.optag.miss{color:var(--purple);border:1px solid #5a4f8a}
.tneed{font-size:13px;color:var(--gold);margin-top:2px}
.cdesc{margin-top:6px}
.cdesc summary{cursor:pointer;color:var(--blue);font-size:13px;list-style:none}
.cdesc summary::-webkit-details-marker{display:none}
.cdesc summary::before{content:'▸ '}
.cdesc[open] summary::before{content:'▾ '}
.cdesc img{width:100%;border-radius:3px;border:1px solid var(--line2);display:block;margin-top:8px}
.crow.done .cdesc{opacity:1}
.chip.media{color:var(--blue);border-color:#2f4560;text-decoration:none}
.chip.media.on{background:#1b2633}
.imgs{display:grid;gap:8px;margin-top:10px}
.imgs img{width:100%;border-radius:3px;border:1px solid var(--line2);display:block}
.it.note .ttl{font-size:16.5px}
.it.warnc{background:var(--redbg);border-left:3px solid var(--red);padding:14px 14px 14px 12px;margin:12px 0;border-bottom:0}
.it.warnc .ii{color:var(--red)}
.it.savec{background:#221b10;border-left:3px solid var(--gold);padding:14px 14px 14px 12px;margin:12px 0;border-bottom:0}
.it.savec .ttl{color:var(--gold)}
.it.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:#33302a}100%{background:transparent}}
.empty{color:var(--mut);text-align:center;padding:28px 0;font-size:14px}
/* badge colors */
.c-shrine{color:var(--teal)} .c-weapon{color:var(--orange)} .c-pendant{color:var(--green)} .c-boss{color:var(--red)}
.c-npc{color:var(--blue)} .c-bamboo{color:#9bc46a} .c-demon{color:#c070c0} .c-riddle{color:var(--purple)} .c-gate{color:#d9c36a}
.c-wugang{color:var(--gold)} .c-taoqing{color:var(--gold)} .c-remembrance{color:#7fc4d8} .c-remains{color:#7fc4d8}
.c-spell{color:#a0a8ff} .c-armor{color:var(--mut)} .c-skill{color:var(--pink)} .c-quest{color:var(--tx2)} .c-ending{color:var(--purple)}
.c-save{color:var(--gold)} .c-other{color:var(--mut)} .c-trophy{color:var(--gold)}
/* ---------- trophies ---------- */
.thead{display:flex;align-items:center;gap:16px;padding:22px 0 14px}
.tgrades{display:flex;gap:14px;flex-wrap:wrap;color:var(--tx2);font-size:14px;margin-top:6px}
.tgrades span{display:inline-flex;align-items:center;gap:5px}
.tfilters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:0 16px}
.tfilters::-webkit-scrollbar{display:none}
.tfilters .fbtn{flex:none;padding:0 14px}
.tro-card{border:1px solid var(--line2);border-radius:4px;background:var(--card);margin-bottom:12px}
.tro-card .th{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;width:100%;text-align:left}
.tro-card .gem{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#111;margin-top:2px}
.gem.platinum{background:var(--plat)} .gem.gold{background:var(--goldt)} .gem.silver{background:var(--silver)} .gem.bronze{background:var(--bronze)}
.tro-card .tm{flex:1;min-width:0}
.tro-card .tn{font-size:17px;font-weight:700;line-height:1.4}
.tro-card .tn small{font-weight:400;color:var(--mut);font-size:13px;margin-left:6px}
.tro-card .td{color:var(--tx2);font-size:14.5px}
.tro-card .tp{font-size:13px;color:var(--mut);margin-top:4px}
.tro-card .tp .bar{height:3px;background:var(--line2);margin-top:6px}
.tro-card .tp .bar i{display:block;height:100%;background:var(--red)}
.tro-card.got .tn{color:var(--green)}
.tro-card.got .gem{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--green)}
.tro-card .tb{padding:0 16px 14px}
.tro-card .tb .detail{color:var(--tx2);font-size:14.5px;border-top:1px solid var(--line);padding-top:12px}
.tro-card .tb .detail p{margin:0 0 8px}
.tgot{display:inline-flex;align-items:center;gap:8px;margin-top:12px;height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:3px;font-size:14px;color:var(--tx2)}
.tro-card.got .tgot{border-color:var(--green);color:var(--green);background:var(--greenbg)}
.clist{margin-top:12px;border-top:1px solid var(--line)}
.crow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.crow .cb{width:24px;height:24px}
.crow.done .cb{background:var(--red2);border-color:var(--red2)}
.crow.done .cb svg{opacity:1}
.crow .cm{flex:1;min-width:0;font-size:14.5px}
.crow .cm .a{display:block;font-size:12.5px;color:var(--mut)}
.crow.done .cm{opacity:.5}
.crow .go{flex:none;color:var(--blue);font-size:13px;padding:2px 0 2px 6px}
/* ---------- side quests ---------- */
.sec-title{font-size:13px;letter-spacing:4px;color:var(--green);margin:24px 0 10px}
.ql-card .qh .t small{color:var(--mut);font-weight:400;font-size:13px;display:block}
.ql-tag{display:inline-block;font-size:12px;border:1px solid #6b5a33;color:var(--gold);border-radius:2px;padding:0 6px;margin-left:6px;vertical-align:2px}
.ql-tag.opt{border-color:var(--line2);color:var(--mut)}
.qarea{font-size:12.5px;color:var(--mut);margin-bottom:2px}
.rich p{margin:0 0 10px;color:var(--tx2);font-size:15px}
.rich ul{margin:0 0 10px;padding-left:20px;color:var(--tx2);font-size:15px}
.rich li{margin:4px 0}
.rich h3{font-size:16px;margin:16px 0 8px;color:var(--tx)}
.rich .red{color:#ff7a6b}
/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 8px;color:var(--mut);font-size:13px;letter-spacing:4px;position:relative}
.nav button.on{color:var(--tx)}
.nav button.on svg{color:var(--red)}
.nav button.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--red)}
/* ---------- search results / menu ---------- */
.sres{padding:14px 0}
.sres .grp{font-size:13px;letter-spacing:2px;color:var(--green);margin:16px 0 6px}
.srow{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.srow .a{font-size:12.5px;color:var(--mut)}
.srow .t{font-size:15.5px;font-weight:600}
.srow .d{font-size:13.5px;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:#5a4a1e;color:inherit;padding:0 1px;border-radius:2px}
.menu{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.menu.on{display:flex}
.menu .panel{width:100%;max-width:760px;background:var(--card);border-top:1px solid var(--line2);padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.menu .panel h3{margin:0 0 10px;font-size:16px}
.menu .panel p{color:var(--tx2);font-size:14px;margin:0 0 12px}
.menu .panel .mb{display:block;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.menu .panel .mb.dang{color:var(--red)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b3035;color:var(--tx);padding:9px 16px;border-radius:4px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
html[lang=en] .rtab .no,html[lang=en] .rno,html[lang=en] .sec-title,html[lang=en] .sres .grp{letter-spacing:1px}
html[lang=en] .nav button{letter-spacing:.5px}
@media (max-width:420px){
  .rname{font-size:40px}
  .stat b{font-size:20px}
  .stat span{font-size:11px}
  .fbtn{font-size:13px}
  .ring{width:84px;height:84px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="searchrow">
      <label class="search" id="searchBox">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" autocomplete="off">
        <button class="clr" id="qclr" aria-label="clear">×</button>
      </label>
      <button class="iconbtn lang" id="langBtn"></button>
      <button class="iconbtn" id="menuBtn" aria-label="menu">⋯</button>
    </div>
    <div class="tabwrap" id="tabwrap"><button class="tabarr l" data-tabarr="-1" aria-label="previous">‹</button><nav class="tabs" id="rtabs"></nav><button class="tabarr r" data-tabarr="1" aria-label="next">›</button></div>
  </div>
</header>
<main class="wrap" id="main"></main>
<nav class="nav"><div class="wrap">

  <button data-tab="side"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 3h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2Z"/><path d="M10 8h6M10 12h6"/><circle cx="7.5" cy="8" r=".4"/></svg><span></span></button>

<script id="appdata" type="application/json">__DATA__</script>
<script id="imgdata" type="application/json">__IMGS__</script>
<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('appdata').textContent);
const IMGS = JSON.parse(document.getElementById('imgdata').textContent);
const KEY = D.storageKey;
const UI = {
  zh:{search:'搜索物品 / 首领 / 奖杯 / NPC', route:'路线', trophy:'成就', side:'支线', region:'区域', done:'项已完成',
      leave:'离开本区前确认', items:'项', colInfo:'本区收集物说明', hideDone:'隐藏已完成', onlyMiss:'只看易错过', onlyTro:'只看奖杯相关',
      selAll:'本区全选', unselAll:'取消全选', miss:'易错过', shots:'截图', video:'视频', source:'查看原文', reach:'如何到达',
      confirmAll:'将本区所有条目标记为已完成？', confirmNone:'取消本区所有条目的完成状态？', noRes:'没有找到结果', empty:'当前筛选下没有条目',
      trophies:'奖杯', got:'已获得', mark:'标记已获得', marked:'已获得', all:'全部', notGot:'未获得', col:'收集类', boss:'首领', ending:'结局', other:'其他',
      endings:'结局路线', quests:'NPC 支线', reqQ:'奖杯相关', optQ:'非奖杯', steps:'步骤', go:'定位', menu:'设置',
      exp:'导出进度（JSON 文件）', imp:'导入进度', reset:'清空全部进度', resetQ:'确定清空所有勾选进度？此操作不可撤销。', imported:'进度已导入', exported:'已导出',
      about:'数据来源', filterBy:'只看', clearF:'清除', of:'/', progress:'进度', noReturn:'不可回头点', pre:'前置', preMore:' 等{n}个', preHead:'奖杯前置（可跳过，但不做就拿不到）', plat:'白金', gold:'金', silver:'银', bronze:'铜',
      all4:'一周目全结局方案', lang:'EN', modePlat:'白金模式', modeAll:'全收集模式', optional:'可选', optTip:'白金不需要', needOf:'奖杯需要 {n} 个（共 {m} 个，任选即可）', reached:'已达到奖杯数量，可在游戏中确认奖杯', noteTip:'提示', howto:'位置说明', imgFail:'图片加载失败，点此打开原图', autoTro:'收集完成，可在游戏中确认奖杯已解锁', resGroups:{item:'路线条目',trophy:'奖杯',quest:'支线'} },
  en:{search:'Search items, bosses, trophies', route:'Route', trophy:'Trophies', side:'Quests', region:'Region', done:'completed',
      leave:'Before leaving this region', items:'items', colInfo:'About collectibles here', hideDone:'Hide done', onlyMiss:'Missables',
      onlyTro:'Trophy only', selAll:'Check all', unselAll:'Uncheck all', miss:'Missable', shots:'Screenshots', video:'Video', source:'Original page', reach:'How to reach',
      confirmAll:'Mark every entry in this region as done?', confirmNone:'Clear all entries in this region?', noRes:'No results', empty:'No entries under current filters',
      trophies:'Trophies', got:'earned', mark:'Mark as earned', marked:'Earned', all:'All', notGot:'Not earned', col:'Collectibles', boss:'Bosses', ending:'Endings', other:'Other',
      endings:'Endings', quests:'NPC Questlines', reqQ:'Trophy related', optQ:'Optional', steps:'steps', go:'Go', menu:'Settings',
      exp:'Export progress (JSON file)', imp:'Import progress', reset:'Reset all progress', resetQ:'Clear all progress? This cannot be undone.', imported:'Progress imported', exported:'Exported',
      about:'Source', filterBy:'Only', clearF:'Clear', of:'/', progress:'Progress', noReturn:'Point of no return', pre:'Prereq', preMore:' +{n}', preHead:'Prerequisites (skippable, but the trophy needs them)', plat:'Plat', gold:'Gold', silver:'Silver', bronze:'Bronze',
      all4:'All endings in one playthrough', lang:'中', modePlat:'Platinum', modeAll:'100%', optional:'Optional', optTip:'not needed for platinum', needOf:'Trophy needs {n} of {m} (any)', reached:'Trophy count reached — check it popped in game', noteTip:'Tip', howto:'How to find', imgFail:'Image failed to load — open original', autoTro:'Collection complete — check the trophy popped in game', resGroups:{item:'Route',trophy:'Trophies',quest:'Quests'} }
};
const TYPE = D.types; // key -> {zh,en,badge:{zh,en},stat:bool}
const ITEMS = {}; // id -> {item, region, area}
D.regions.forEach((r,ri)=>r.areas.forEach((a,ai)=>a.sections.forEach(s=>s.items.forEach(it=>{ITEMS[it.id]={it,r,a,ri,ai};}))));
const TRO = {}; D.trophies.forEach(t=>TRO[t.id]=t);

// ---------- state ----------
const LANG0 = (D.lang && D.lang.default) || 'zh', BILINGUAL = !(D.lang && D.lang.bilingual===false);
let st = {done:{}, tro:{}, closed:{}, lang:LANG0, tab:'route', region:0, f:{hideDone:false,onlyMiss:false,onlyTro:false,type:''}, tf:'all', boxes:{}};
try{ const s = JSON.parse(localStorage.getItem(KEY)||'null'); if(s){ st = Object.assign(st, s); st.f = Object.assign({hideDone:false,onlyMiss:false,onlyTro:false,type:''}, s.f||{}); } }catch(e){}
if(!st.mode) st.mode = (D.mode && D.mode.default) || 'all';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
// platinum mode counts only items the platinum needs; 100% mode counts every checkable item
const counted = it => it.check && (st.mode==='all' || !it.opt || !(D.mode && D.mode.enabled));
// in platinum mode a missable thing the platinum doesn't need isn't worth a warning
const missFlag = it => it.miss && (st.mode==='all' || !it.opt || !(D.mode && D.mode.enabled));
const U = ()=>UI[st.lang];
const L = o => o==null ? '' : (typeof o==='string' ? o : (o[st.lang] || o.zh || o.en || ''));
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => String(s||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();
const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f3d9d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
const CHEV = '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg>';
const INFO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>';
const WARN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v5M12 17.5v.5"/></svg>';
const isDone = id => !!st.done[id];
const checkable = it => it.check;

function ring(p, size, color){
  const r=44, c=2*Math.PI*r, off=c*(1-p);
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="#2b3035" stroke-width="5"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="butt"/></svg>`;
}
function regionStats(r){
  let tot=0, dn=0;
  r.areas.forEach(a=>a.sections.forEach(s=>s.items.forEach(it=>{ if(counted(it)){tot++; if(isDone(it.id)) dn++;} })));
  return {tot, dn};
}
function areaStats(a){
  let tot=0, dn=0;
  a.sections.forEach(s=>s.items.forEach(it=>{ if(counted(it)){tot++; if(isDone(it.id)) dn++;} }));
  return {tot, dn};
}

// ---------- rendering: tabs ----------
let centeredRegion = -1;
function tabArrows(){
  const el = document.getElementById('rtabs'), w = document.getElementById('tabwrap');
  w.querySelector('.l').classList.toggle('show', el.scrollLeft > 4);
  w.querySelector('.r').classList.toggle('show', el.scrollLeft + el.clientWidth < el.scrollWidth - 4);
}
function renderTabs(){
  const el = document.getElementById('rtabs'), wrap = document.getElementById('tabwrap');
  if(st.tab!=='route' || query){ wrap.style.display='none'; return; }
  wrap.style.display='';
  el.innerHTML = D.regions.map((r,i)=>{
    const s=regionStats(r);
    return `<button class="rtab ${i===st.region?'on':''} ${st.lang==='en'?'en':''}" data-r="${i}"><span class="no">${esc(L(r.no))}</span><span class="nm">${esc(L(r.short))}</span>${i===st.region?'':`<span class="mini"><i style="width:${s.tot?Math.round(100*s.dn/s.tot):0}%"></i></span>`}</button>`;
  }).join('');
  const on = el.querySelector('.on');
  if(on && centeredRegion !== st.region){  // centre the active region once per change, so both neighbours stay visible
    centeredRegion = st.region;
    const r = on.getBoundingClientRect(), c = el.getBoundingClientRect();
    el.style.scrollBehavior = 'auto';
    el.scrollLeft += (r.left + r.width/2) - (c.left + c.width/2);
    el.style.scrollBehavior = '';
  }
  tabArrows();
}

// ---------- rendering: route ----------
function itemVisible(it){
  if(st.f.hideDone && it.check && isDone(it.id)) return false;
  if(st.f.onlyMiss && !missFlag(it)) return false;
  if(st.f.onlyTro && !(it.tro && it.tro.length) && !(it.pre && it.pre.length)) return false;
  if(st.f.type && it.type!==st.f.type && !(it.stags||[]).includes(st.f.type)) return false;
  return true;
}
function itemHTML(it, opts){
  opts=opts||{};
  const t = TYPE[it.type]||TYPE.other;
  const d = isDone(it.id);
  const cls = ['it'];
  if(!it.check) cls.push('note');
  if(it.style==='warn') cls.push('warnc');
  if(it.style==='save') cls.push('savec');
  if(d && it.check) cls.push('done');
  if(it.opt && it.check && D.mode && D.mode.enabled) cls.push('opt');
  const head = L(it.head);
  const body = L(it.body);
  let lead = it.check ? `<button class="cb" data-check="${it.id}" aria-label="check">${CHECK}</button>` : `<div class="ii">${it.style==='warn'?WARN:INFO}</div>`;
  let badge = (it.check || it.type==='ending' || it.type==='save') && t.badge ? `<span class="badge c-${it.type}">${esc(L(t.badge))}</span>` : '';
  let chips = '';
  (it.tro||[]).forEach(tid=>{ const tr=TRO[tid]; if(tr) chips += `<button class="chip tro" data-gotro="${tid}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M12 13v4M8.5 20h7"/></svg>${esc(L(tr.name))}</button>`; });
  const pre=(it.pre||[]).filter(t=>TRO[t]); if(pre.length) chips += `<button class="chip tro pre" data-gotro="${pre[0]}">${esc(U().pre)} · ${esc(L(TRO[pre[0]].name))}${pre.length>1?esc(U().preMore.replace('{n}',pre.length)):''}</button>`;
  if(it.noreturn) chips += `<span class="chip nr">${esc(U().noReturn)}</span>`;
  if(missFlag(it)) chips += `<span class="chip miss">${esc(U().miss)}</span>`;
  if(it.opt && it.check && D.mode && D.mode.enabled) chips += `<span class="chip opt" title="${esc(U().optTip)}">${esc(U().optional)}</span>`;
  if(it.imgs && it.imgs.length) chips += `<button class="chip media" data-imgs="${it.id}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>${esc(U().shots)} ${it.imgs.length}</button>`;
  (it.videos||[]).forEach(v=>{ chips += `<a class="chip media" href="${esc(v)}" target="_blank" rel="noopener">▶ ${esc(U().video)}</a>`; });
  const loc = opts.loc ? `<div class="qarea">${esc(opts.loc)}</div>` : '';
  return `<div class="${cls.join(' ')}" id="it-${it.id}" data-id="${it.id}">${lead}<div class="im">${loc}${head?`<div class="ih">${badge}<div class="ttl">${head}</div></div>`:''}${body?`<div class="ibd">${body}</div>`:''}${it.preNote?`<div class="prenote">${esc(L(it.preNote))}</div>`:''}${chips?`<div class="chips">${chips}</div>`:''}<div class="imgs" id="imgs-${it.id}" hidden></div></div></div>`;
}
function preList(t){
  if(!t.pre || !t.pre.length) return '';
  const u=U();
  return `<div class="prelh">${esc(u.preHead)}</div><div class="clist">${t.pre.map(id=>{ const x=ITEMS[id]; if(!x) return ''; const d=isDone(id);
    return `<div class="crow ${d?'done':''}"><button class="cb" data-check="${id}">${CHECK}</button><div class="cm">${strip(L(x.it.head))}<span class="a">${esc(L(x.r.short))} · ${esc(L(x.a.title))}</span></div><button class="go" data-goto="${id}">${esc(u.go)} ›</button></div>`; }).join('')}</div>`;
}
function renderRoute(){
  const r = D.regions[st.region];
  const s = regionStats(r);
  const pct = s.tot ? Math.round(100*s.dn/s.tot) : 0;
  const u = U();
  // stats grid
  const counts = {};
  const dones = {};
  r.areas.forEach(a=>a.sections.forEach(sec=>sec.items.forEach(it=>{ if(counted(it)) (it.stags||[]).forEach(k=>{ counts[k]=(counts[k]||0)+1; if(isDone(it.id)) dones[k]=(dones[k]||0)+1; }); })));
  const order = D.statOrder.filter(k=>counts[k]);
  let stats = order.map(k=>`<button class="stat ${dones[k]===counts[k]?'full':''} ${st.f.type===k?'sel':''}" data-type="${k}"><b>${counts[k]}</b><span>${esc(L(TYPE[k]))}</span></button>`).join('');
  const leaveOpen = st.boxes['leave-'+r.id]!==false;
  const colOpen = st.boxes['col-'+r.id]===true;
  let html = `
  <section class="rhead"><div class="l"><div class="rno">${esc(L(r.no))}</div><div class="rname ${st.lang==='en'?'en':''}">${esc(L(r.short))}</div><div class="rcount">${s.dn} / ${s.tot} ${esc(u.done)}</div>${D.mode && D.mode.enabled ? `<div class="modesw"><button data-mode="plat" class="${st.mode==='plat'?'on':''}">${esc(u.modePlat)}</button><button data-mode="all" class="${st.mode==='all'?'on':''}">${esc(u.modeAll)}</button></div>` : ''}</div>
  <div class="ring">${ring(pct/100,96,pct===100?'#79ad91':'#d2483b')}<div class="v">${pct}<small>%</small></div></div></section>
  ${L(r.summary)?`<div class="rdesc">${L(r.summary)}</div>`:''}
  <div class="stats">${stats}</div>
  ${r.leave && r.leave.length ? `<div class="box warn ${leaveOpen?'':'closed'}" data-box="leave-${r.id}"><button class="bh">${WARN.replace('width="22" height="22"','width="24" height="24" style="color:var(--red)"')}<span class="t">${esc(u.leave)}</span><span class="n">${r.leave.length} ${esc(u.items)}</span>${CHEV}</button><div class="bb"><ul>${r.leave.map(x=>`<li>${L(x)}</li>`).join('')}</ul></div></div>`:''}
  <div class="box ${colOpen?'':'closed'}" data-box="col-${r.id}"><button class="bh">${INFO}<span class="t">${esc(u.colInfo)}</span>${CHEV}</button><div class="bb rich">${L(r.colInfo)}</div></div>
  <div class="filters">
    <button class="fbtn ${st.f.hideDone?'on':''}" data-f="hideDone">${esc(u.hideDone)}</button>
    <button class="fbtn ${st.f.onlyMiss?'on':''}" data-f="onlyMiss">${esc(u.onlyMiss)}</button>
    <button class="fbtn ${st.f.onlyTro?'on':''}" data-f="onlyTro">${esc(u.onlyTro)}</button>
    <button class="fbtn ${s.dn===s.tot&&s.tot?'on':''}" data-selall="1">${esc(s.dn===s.tot&&s.tot?u.unselAll:u.selAll)}</button>
  </div>
  ${st.f.type?`<div class="typebar">${esc(u.filterBy)}：${esc(L(TYPE[st.f.type]))} <button data-cleartype="1">${esc(u.clearF)}</button></div>`:''}
  <div class="steps">`;
  let any=false;
  r.areas.forEach((a,ai)=>{
    const as = areaStats(a);
    const complete = as.tot>0 && as.dn===as.tot;
    const closed = st.closed[a.id]===true;
    let inner = '';
    let shown = 0;
    if(L(a.reach)) inner += `<div class="reach"><b>${esc(u.reach)}：</b>${L(a.reach)}</div>`;
    a.sections.forEach(sec=>{
      const vis = sec.items.filter(itemVisible);
      if(!vis.length) return;
      if(a.sections.length>1 && L(sec.title)) inner += `<div class="sect">${esc(L(sec.title))}</div>`;
      vis.forEach(it=>{ inner += itemHTML(it); shown++; });
    });
    const filtering = st.f.hideDone||st.f.onlyMiss||st.f.onlyTro||st.f.type;
    if(filtering && !shown) return;
    any=true;
    inner += `<a class="srclink" href="${esc(a.url)}" target="_blank" rel="noopener">↗ ${esc(u.source)} · PowerPyx</a>`;
    html += `<div class="step ${complete?'complete':''}" id="step-${a.id}"><div class="num"><b>${complete?CHECK.replace('#f3d9d5','#10201a'):(ai+1)}</b></div>
      <div class="scard ${closed?'closed':''}"><button class="sh" data-step="${a.id}"><div class="row"><div class="t">${esc(L(a.title))}${L(a.tagline)?`<small>${esc(L(a.tagline))}</small>`:''}</div><span class="n">${as.tot?as.dn+"/"+as.tot:"—"}</span>${CHEV}</div><div class="bar"><i style="width:${as.tot?100*as.dn/as.tot:0}%"></i></div></button>
      <div class="sb">${inner||`<div class="empty">${esc(u.empty)}</div>`}</div></div></div>`;
  });
  if(!any) html += `<div class="empty">${esc(u.empty)}</div>`;
  html += `</div>`;
  return html;
}

// ---------- rendering: trophies ----------
function colProgress(t){
  if(!t.col) return null;
  let dn=0; t.col.forEach(c=>{ if(isDone(c.id)) dn++; });
  return {dn, tot:t.col.length, need:t.need||t.col.length};
}
function troGot(t){ return !!st.tro[t.id]; }
function renderTrophies(){
  const u=U();
  const got = D.trophies.filter(troGot).length;
  const g = {platinum:0,gold:0,silver:0,bronze:0}, gg={platinum:0,gold:0,silver:0,bronze:0};
  D.trophies.forEach(t=>{ g[t.grade]++; if(troGot(t)) gg[t.grade]++; });
  const pct = Math.round(100*got/D.trophies.length);
  const flt = st.tf;
  const list = D.trophies.filter(t=>{
    if(flt==='todo') return !troGot(t);
    if(flt==='col') return t.cat==='col';
    if(flt==='boss') return t.cat==='boss';
    if(flt==='ending') return t.cat==='ending';
    if(flt==='other') return t.cat==='other';
    if(flt==='miss') return !!t.miss;
    return true;
  });
  let html = `<section class="thead"><div style="flex:1"><div class="rno">${esc(u.trophies)}</div><div class="rname ${st.lang==='en'?'en':''}">${esc(L(D.game.short))}</div>
    <div class="rcount">${got} / ${D.trophies.length} ${esc(u.got)}</div>
    <div class="tgrades"><span><t class="platinum"></t>${gg.platinum}/${g.platinum}</span><span><t class="gold"></t>${gg.gold}/${g.gold}</span><span><t class="silver"></t>${gg.silver}/${g.silver}</span><span><t class="bronze"></t>${gg.bronze}/${g.bronze}</span></div></div>
    <div class="ring">${ring(pct/100,96,pct===100?'#79ad91':'#d2483b')}<div class="v">${pct}<small>%</small></div></div></section>
    ${D.roadmap?`<div class="box ${st.boxes.roadmap===true?'':'closed'}" data-box="roadmap"><button class="bh">${INFO}<span class="t">${esc(L(D.roadmap.title))}</span>${CHEV}</button><div class="bb rich">${L(D.roadmap.html)}</div></div>`:''}
    <div class="tfilters">${[['all',u.all],['todo',u.notGot],...(D.trophies.some(t=>t.miss)?[['miss',u.miss]]:[]),['col',u.col],['boss',u.boss],['ending',u.ending],['other',u.other]].map(([k,n])=>`<button class="fbtn ${flt===k?'on':''}" data-tf="${k}">${esc(n)}</button>`).join('')}</div>`;
  list.forEach(t=>{
    const p = colProgress(t);
    const open = st.boxes['tro-'+t.id]===true;
    const gotc = troGot(t);
    let prog = '';
    if(p){ const ok = p.dn>=p.need, part = p.need<p.tot;
      prog = `${t.needNote?`<div class="tneed">${esc(L(t.needNote))}</div>`:''}${part?`<div class="tneed">${esc(u.needOf.replace('{n}',p.need).replace('{m}',p.tot))}</div>`:''}<div class="tp">${esc(u.progress)} ${Math.min(p.dn,p.need)}/${p.need}${part&&p.dn>p.need?` (${p.dn})`:''}${ok&&!gotc?' · '+esc(part?u.reached:u.autoTro):''}<div class="bar"><i style="width:${100*Math.min(1,p.dn/p.need)}%;${ok?'background:var(--green)':''}"></i></div></div>`; }
    else if(t.items && t.items.length){ const dn=t.items.filter(isDone).length; prog = `<div class="tp">${esc(u.progress)} ${dn}/${t.items.length}</div>`; }
    let col = '';
    if(t.col){
      const reached = p && p.need<p.tot && p.dn>=p.need;
      col = `<div class="clist">${t.col.map(c=>{
        const d=isDone(c.id); const linked = c.goto || (ITEMS[c.id] ? c.id : null); const o = reached && !d;
        const extra = c.desc ? `<details class="cdesc"><summary>${esc(u.howto)}</summary><div class="ibd">${L(c.desc)}</div>${(c.imgs||[]).map(k=>`<img data-src="${IMGS[k]}" alt="">`).join('')}${(c.videos||[]).map(v=>`<a class="chip media" href="${esc(v)}" target="_blank" rel="noopener">▶ ${esc(u.video)}</a>`).join(' ')}</details>` : '';
        return `<div class="crow ${d?'done':''} ${o?'opt':''}"><button class="cb" data-check="${c.id}">${CHECK}</button><div class="cm">${esc(L(c.label))}${c.miss?`<span class="optag miss">${esc(u.miss)}</span>`:''}${o?`<span class="optag">${esc(u.optional)}</span>`:''}<span class="a">${esc(L(c.area))}</span>${extra}</div>${linked?`<button class="go" data-goto="${linked}">${esc(u.go)} ›</button>`:''}</div>`;
      }).join('')}</div>`;
    } else if(t.items && t.items.length){
      col = `<div class="clist">${t.items.map(id=>{ const x=ITEMS[id]; if(!x) return ''; const d=isDone(id);
        return `<div class="crow ${d?'done':''}"><button class="cb" data-check="${id}">${CHECK}</button><div class="cm">${strip(L(x.it.head))}<span class="a">${esc(L(x.r.short))} · ${esc(L(x.a.title))}</span></div><button class="go" data-goto="${id}">${esc(u.go)} ›</button></div>`; }).join('')}</div>`;
    }
    html += `<div class="tro-card ${gotc?'got':''} ${open?'':'closed'}" data-box="tro-${t.id}">
      <button class="th bh"><span class="gem ${t.grade}">${esc(u[t.grade==='platinum'?'plat':t.grade])}</span><div class="tm"><div class="tn">${esc(L(t.name))}${t.miss?`<span class="optag miss">${esc(u.miss)}</span>`:''}${st.lang==='zh'?`<small>${esc(t.name.en)}</small>`:''}</div><div class="td">${esc(L(t.desc))}</div>${prog}</div>${CHEV}</button>
      <div class="bb tb"><div class="detail rich">${L(t.detail)}</div>${(t.videos||[]).map(v=>`<a class="chip media" style="margin-top:8px" href="${esc(v)}" target="_blank" rel="noopener">▶ ${esc(u.video)}</a>`).join(' ')}${col}${preList(t)}
      <button class="tgot" data-tro="${t.id}">${gotc?CHECK.replace('#f3d9d5','#79ad91')+esc(u.marked):esc(u.mark)}</button></div></div>`;
  });
  return html;
}

// ---------- rendering: side quests ----------
function renderSide(){
  const u=U();
  let html = `<section class="thead"><div style="flex:1"><div class="rno">${esc(u.side)}</div><div class="rname ${st.lang==='en'?'en':''}">${esc(L(D.side.title))}</div></div></section>`;
  if(D.endings.length || D.endingsAll) html += `<div class="sec-title">${esc(u.endings)}</div>`;
  D.endings.forEach(e=>{
    const open = st.boxes['end-'+e.id]===true;
    const tr = TRO[e.trophy];
    html += `<div class="tro-card ${tr&&troGot(tr)?'got':''} ${open?'':'closed'}" data-box="end-${e.id}"><button class="th bh"><span class="gem gold">${esc(u.gold)}</span><div class="tm"><div class="tn">${esc(L(e.title))}</div><div class="td">${esc(L(e.sub))}</div></div>${CHEV}</button><div class="bb tb"><div class="detail rich">${L(e.html)}</div>${(e.videos||[]).map(v=>`<a class="chip media" style="margin-top:8px" href="${esc(v)}" target="_blank" rel="noopener">▶ ${esc(u.video)}</a>`).join(' ')}</div></div>`;
  });
  if(D.endingsAll){
    const open = st.boxes['end-all']===true;
    html += `<div class="box warn ${open?'':'closed'}" data-box="end-all"><button class="bh">${WARN.replace('width="22" height="22"','width="24" height="24" style="color:var(--red)"')}<span class="t">${esc(L(D.endingsAll.title))}</span>${CHEV}</button><div class="bb rich">${L(D.endingsAll.html)}</div></div>`;
  }
  if(D.questlines.length) html += `<div class="sec-title">${esc(u.quests)}</div>`;
  if(D.questlines.length && L(D.side.intro)) html += `<div class="rich" style="margin-bottom:12px">${L(D.side.intro)}</div>`;
  D.questlines.forEach(q=>{
    const open = st.boxes['ql-'+q.id]===true;
    const dn = q.items.filter(isDone).length;
    const complete = q.items.length && dn===q.items.length;
    html += `<div class="step ${complete?'complete':''}" style="margin-bottom:12px"><div class="scard ql-card ${open?'':'closed'}" data-box="ql-${q.id}" style="margin:0">
      <button class="sh bh qh"><div class="row"><div class="t">${esc(L(q.name))}<span class="ql-tag ${q.req?'':'opt'}">${esc(q.req?u.reqQ:u.optQ)}</span>${L(q.reward)?`<small>${esc(L(q.reward))}</small>`:''}</div><span class="n">${dn}/${q.items.length}</span>${CHEV}</div><div class="bar"><i style="width:${q.items.length?100*dn/q.items.length:0}%"></i></div></button>
      <div class="sb">${L(q.intro)?`<div class="rich" style="padding-top:12px">${L(q.intro)}</div>`:''}${q.items.map(id=>{const x=ITEMS[id]; return x?itemHTML(x.it,{loc:L(x.r.short)+' · '+L(x.a.title)}):'';}).join('')}<a class="srclink" href="${esc(D.side.url)}#${esc(q.anchor||'')}" target="_blank" rel="noopener">↗ ${esc(u.source)} · PowerPyx</a></div></div></div>`;
  });
  return html;
}

// ---------- search ----------
function hl(s, q){ if(!q) return esc(s); const i=s.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(s); return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)); }
function snippet(s,q){ const i=s.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return s.slice(0,90); const a=Math.max(0,i-30); return (a?'…':'')+s.slice(a,a+110); }
function renderSearch(q){
  const u=U(); const ql=q.toLowerCase();
  const res={item:[],trophy:[],quest:[]};
  Object.values(ITEMS).forEach(x=>{
    const zh = strip(x.it.head.zh)+' '+strip(x.it.body.zh), en = strip(x.it.head.en)+' '+strip(x.it.body.en);
    if(zh.toLowerCase().includes(ql) || en.toLowerCase().includes(ql)) res.item.push(x);
  });
  D.trophies.forEach(t=>{ const s=[t.name.zh,t.name.en,t.desc.zh,t.desc.en].join(' ').toLowerCase(); if(s.includes(ql)) res.trophy.push(t); });
  D.questlines.forEach(q2=>{ const s=[q2.name.zh,q2.name.en].join(' ').toLowerCase(); if(s.includes(ql)) res.quest.push(q2); });
  let html='<div class="sres">';
  const n = res.item.length+res.trophy.length+res.quest.length;
  if(!n) html += `<div class="empty">${esc(u.noRes)}</div>`;
  if(res.trophy.length){ html+=`<div class="grp">${esc(u.resGroups.trophy)} · ${res.trophy.length}</div>`; res.trophy.forEach(t=>{ html+=`<button class="srow" data-gotro="${t.id}"><div class="t">${hl(L(t.name),q)}</div><div class="d">${hl(L(t.desc),q)}</div></button>`; }); }
  if(res.quest.length){ html+=`<div class="grp">${esc(u.resGroups.quest)} · ${res.quest.length}</div>`; res.quest.forEach(x=>{ html+=`<button class="srow" data-goql="${x.id}"><div class="t">${hl(L(x.name),q)}</div></button>`; }); }
  if(res.item.length){ html+=`<div class="grp">${esc(u.resGroups.item)} · ${res.item.length}</div>`;
    res.item.slice(0,150).forEach(x=>{ const h=strip(L(x.it.head))||strip(L(x.it.body)).slice(0,40); const b=strip(L(x.it.body));
      let d = b.toLowerCase().includes(ql)?snippet(b,q):b.slice(0,100);
      if(!(h+d).toLowerCase().includes(ql)){ const other=strip(st.lang==='zh'?x.it.head.en+' '+x.it.body.en:x.it.head.zh+' '+x.it.body.zh); d = snippet(other,q); }
      html+=`<button class="srow" data-goto="${x.it.id}"><div class="a">${esc(L(x.r.short))} · ${esc(L(x.a.title))}</div><div class="t">${hl(h,q)}</div><div class="d">${hl(d,q)}</div></button>`; }); }
  return html+'</div>';
}

// ---------- main render ----------
let query='';
function render(keepScroll){
  const u=U();
  document.documentElement.lang = st.lang==='zh'?'zh-CN':'en';
  document.getElementById('q').placeholder = u.search;
  if(!BILINGUAL){ st.lang = LANG0; document.getElementById('langBtn').style.display = 'none'; }
  document.getElementById('langBtn').textContent = u.lang;
  document.querySelectorAll('.nav button').forEach(b=>{ b.classList.toggle('on', b.dataset.tab===st.tab && !query); b.querySelector('span').textContent = u[b.dataset.tab]; });
  const y = window.scrollY;
  renderTabs();
  const main = document.getElementById('main');
  if(query){ main.innerHTML = renderSearch(query); }
  else if(st.tab==='route') main.innerHTML = renderRoute();
  else if(st.tab==='trophy') main.innerHTML = renderTrophies();
  else main.innerHTML = renderSide();
  if(keepScroll) window.scrollTo(0,y);
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1600); }

function goto(id){
  const x = ITEMS[id]; if(!x) return;
  query=''; document.getElementById('q').value=''; document.getElementById('searchBox').classList.remove('has');
  st.tab='route'; st.region=x.ri; st.closed[x.a.id]=false;
  if(!itemVisible(x.it)){ st.f={hideDone:false,onlyMiss:false,onlyTro:false,type:''}; }
  save(); render();
  requestAnimationFrame(()=>{ const el=document.getElementById('it-'+id); if(el){ const top=el.getBoundingClientRect().top+window.scrollY-170; window.scrollTo({top,behavior:'smooth'}); el.classList.add('flash'); } });
}
function gotoTro(id){
  query=''; document.getElementById('q').value=''; document.getElementById('searchBox').classList.remove('has');
  st.tab='trophy'; st.tf='all'; st.boxes['tro-'+id]=true; save(); render();
  requestAnimationFrame(()=>{ const el=document.querySelector(`[data-box="tro-${id}"]`); if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-80,behavior:'smooth'}); });
}

// ---------- events ----------
document.addEventListener('click', e=>{
  const t = e.target.closest('button,a'); if(!t) return;
  const ds = t.dataset;
  if(ds.check){ const id=ds.check; if(st.done[id]) delete st.done[id]; else st.done[id]=1; save(); render(true); return; }
  if(ds.tabarr){ const el=document.getElementById('rtabs'); el.scrollBy({left: (+ds.tabarr) * el.clientWidth * 0.7, behavior:'smooth'}); return; }
  if(ds.r!==undefined){ st.region=+ds.r; st.f.type=''; save(); render(); window.scrollTo(0,0); return; }
  if(ds.tab){ query=''; document.getElementById('q').value=''; document.getElementById('searchBox').classList.remove('has'); st.tab=ds.tab; save(); render(); window.scrollTo(0,0); return; }
  if(ds.f){ st.f[ds.f]=!st.f[ds.f]; save(); render(true); return; }
  if(ds.mode){ st.mode=ds.mode; save(); render(true); return; }
  if(ds.type){ st.f.type = st.f.type===ds.type?'':ds.type; save(); render(true); return; }
  if(ds.cleartype){ st.f.type=''; save(); render(true); return; }
  if(ds.selall){ const r=D.regions[st.region]; const s=regionStats(r); const all = s.dn===s.tot;
    if(!confirm(all?U().confirmNone:U().confirmAll)) return;
    r.areas.forEach(a=>a.sections.forEach(sec=>sec.items.forEach(it=>{ if(counted(it)){ if(all) delete st.done[it.id]; else st.done[it.id]=1; } })));
    save(); render(true); return; }
  if(ds.step){ st.closed[ds.step] = !st.closed[ds.step]; save(); render(true); return; }
  if(ds.tf){ st.tf=ds.tf; save(); render(true); return; }
  if(ds.tro){ if(st.tro[ds.tro]) delete st.tro[ds.tro]; else st.tro[ds.tro]=1; save(); render(true); return; }
  if(ds.goto){ goto(ds.goto); return; }
  if(ds.gotro){ e.preventDefault(); gotoTro(ds.gotro); return; }
  if(ds.goql){ query=''; document.getElementById('q').value=''; st.tab='side'; st.boxes['ql-'+ds.goql]=true; save(); render(); requestAnimationFrame(()=>{const el=document.querySelector(`[data-box="ql-${ds.goql}"]`); if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-80,behavior:'smooth'});}); return; }
  if(ds.imgs){ const box=document.getElementById('imgs-'+ds.imgs); const x=ITEMS[ds.imgs]; if(!box||!x) return;
    if(box.hidden){ box.innerHTML = x.it.imgs.map(k=>`<img src="${IMGS[k]}" alt="">`).join(''); box.hidden=false; t.classList.add('on');
      box.querySelectorAll('img').forEach(im=>im.addEventListener('error',()=>{ const a=document.createElement('a'); a.href=im.src; a.target='_blank'; a.rel='noopener'; a.className='chip media'; a.textContent=U().imgFail; im.replaceWith(a); })); }
    else { box.hidden=true; box.innerHTML=''; t.classList.remove('on'); } return; }
  if(t.classList.contains('bh')){ const box=t.closest('[data-box]'); if(box){ const k=box.dataset.box; const isClosed=box.classList.toggle('closed'); st.boxes[k]=!isClosed; save(); } return; }
  if(t.id==='langBtn'){ st.lang = st.lang==='zh'?'en':'zh'; save(); render(true); return; }
  if(t.id==='qclr'){ e.preventDefault(); query=''; document.getElementById('q').value=''; document.getElementById('searchBox').classList.remove('has'); render(); return; }
  if(t.id==='menuBtn'){ openMenu(); return; }
  if(ds.menu){ menuAction(ds.menu); return; }
});
document.getElementById('menu').addEventListener('click', e=>{ if(e.target.id==='menu') e.currentTarget.classList.remove('on'); });
let qT;
document.getElementById('q').addEventListener('input', e=>{
  clearTimeout(qT); const v=e.target.value.trim();
  document.getElementById('searchBox').classList.toggle('has', !!v);
  qT=setTimeout(()=>{ query=v; render(); window.scrollTo(0,0); }, 180);
});
function openMenu(){
  const u=U();
  document.getElementById('menuPanel').innerHTML = `<h3>${esc(u.menu)}</h3><p>${L(D.about)}</p>
    <button class="mb" data-menu="export">${esc(u.exp)}</button>
    <button class="mb" data-menu="import">${esc(u.imp)}</button>
    <button class="mb dang" data-menu="reset">${esc(u.reset)}</button>`;
  document.getElementById('menu').classList.add('on');
}
function menuAction(a){
  const u=U();
  if(a==='export'){
    const blob = new Blob([JSON.stringify({key:KEY, exported:new Date().toISOString(), done:st.done, tro:st.tro},null,1)],{type:'application/json'});
    const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download=KEY+'-progress.json'; document.body.appendChild(link); link.click(); link.remove();
    toast(u.exported);
  } else if(a==='import'){ document.getElementById('importFile').click(); }
  else if(a==='reset'){ if(confirm(u.resetQ)){ st.done={}; st.tro={}; save(); render(); } }
  document.getElementById('menu').classList.remove('on');
}
document.getElementById('importFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result); st.done=o.done||{}; st.tro=o.tro||{}; save(); render(); toast(U().imported); }catch(err){ alert('JSON error'); } };
  rd.readAsText(f); e.target.value='';
});
document.addEventListener('toggle', e=>{ const d=e.target; if(d.tagName==='DETAILS' && d.open) d.querySelectorAll('img[data-src]').forEach(im=>{ im.src=im.dataset.src; im.removeAttribute('data-src'); }); }, true);
const tabsEl = document.getElementById('rtabs');
tabsEl.addEventListener('scroll', tabArrows, {passive:true});
tabsEl.addEventListener('wheel', e=>{  // mouse wheel scrolls the strip sideways
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX) && tabsEl.scrollWidth > tabsEl.clientWidth){ tabsEl.scrollLeft += e.deltaY; e.preventDefault(); }
}, {passive:false});
window.addEventListener('resize', tabArrows);
render();
})();
</script>
</body>
</html>
